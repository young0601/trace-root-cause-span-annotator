[project]
name = "trace-root-cause-span-annotator"
version = "0.1.3"
description = "Traces the deepest error in a span tree and marks ancestor spans to pinpoint root causes during triage"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
